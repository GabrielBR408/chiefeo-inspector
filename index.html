    <!-- ===== SEO: meta / Open Graph / Twitter / JSON-LD =====
         Copy is the ChiefEO SEO package (meta_og_tags.md block 4 + schema_markup.md
         block 4), mirrored from the hub landing page at
         chiefeotool.com/tools/chiefeoinspector.

         chiefeo-inspector.vercel.app origin — the .vercel.app origin is listed under
         schema "sameAs" instead. NEEDS CONFIRMATION before this is indexed.
         Replaced by the package copy: the prior title tag "ChiefEO Inspector", the prior
         description / og:title / og:description ("Talk-and-photo AI property inspection
         reports."), and the prior og:url (which carried a trailing slash).
         og:image now points at the shared social card hosted by the hub repo at
         chiefeotool.com/images/og-inspector.png (1200x630); it resolves once that
         hub change is deployed. -->
    <title>ChiefEO Inspector — Property Inspection Tool | ChiefEO</title>
    <meta name="description" content="Voice-dictated property inspections with AI-assisted drafting. Deterministic field capture keeps your data structured, not AI-hallucinated." />
    <link rel="canonical" href="https://chiefeotool.com/chiefeoinspector" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ChiefEO Inspector: Voice Inspections, Real Structure" />
    <meta property="og:description" content="Push-to-talk inspection dictation with AI-assisted drafting on top of deterministic field capture. Works offline." />
    <meta property="og:url" content="https://chiefeotool.com/chiefeoinspector" />
    <meta property="og:site_name" content="ChiefEO" />
    <meta property="og:image" content="https://chiefeotool.com/images/og-inspector.png" />

    <meta name="twitter:image" content="https://chiefeotool.com/chiefeoinspector/icons/icon-512.png" />

    <!-- schema "image" omitted: the package specifies
         /images/chiefeo-inspector-screenshot.png, which does not exist in this repo.

        "@type": "Organization",
        "name": "Golden Real Estate Ventures and Exchanges LLC",
